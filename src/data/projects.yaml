- slug: ha-smart-comfort
  title: Smart Comfort
  kind: integration
  withCard: true
  category: climate
  icon: mdiHomeThermometer
  accent: '#26a69a'
  tagline: 'Fewer, smarter comfort alerts, and climate devices and lights that adjust themselves, room by room.'
  summary: 'Tracks each comfort problem as an episode: notified once when it starts, again only if it gets worse. Temperature, CO₂, humidity, noise, outdoor air and windows to open or close, automatic control of air conditioners, fans and purifiers with a quiet night, and adaptive lighting. Everything is set up room by room in its own panel.'
  highlights:
  - 'Ten alerts per room: heat, cold, windows, CO₂, humidity, noise, outdoor air'
  - Episodes instead of cooldowns, grouped in one digest notification
  - Quiet hours, presence and iOS / Android interruption levels, with Snooze and Got it buttons
  - Air conditioners, fans and purifiers controlled automatically, quieter at night
  - Adaptive lighting by time of day, with a quiet morning and nap slots per room
  - Lights on presence, with time slots, night lights and a color per slot
  - Outdoor places and air quality index to suggest opening or closing the windows
  - Setup panel in the sidebar, with room discovery, a day schedule and the YAML of the setup
  - Activity log in the panel and in an activity card for the dashboard
  homeassistant: 2024.12.0
  keywords: "comfort notifications alerts co2 humidity temperature noise windows lights lighting adaptive presence motion nap night activity log"
  cardTypes:
  - smart-comfort-activity-card
  hero:
    src: panel-overview.png
    dark: panel-overview-dark.png
    caption: Overview
    group: Panel
