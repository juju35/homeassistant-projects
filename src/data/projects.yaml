- slug: ha-battery-monitor
  title: Battery Monitor
  kind: integration
  withCard: true
  category: home
  icon: mdiBatteryAlert
  accent: '#ffa600'
  tagline: Watches every battery of your home and tells you twice a day which ones are low.
  summary: 'No more alert for a battery that dips for an hour, no more dead sensor found a week later: a battery is reported once it has stayed below the threshold for a while, with a card listing them by room.'
  highlights:
  - Automatic discovery of every battery
  - Threshold and duration before notifying
  - Unavailable batteries reported too
  - Two notifications a day, at times you choose
  - Lovelace card with a full screen view by room or type
