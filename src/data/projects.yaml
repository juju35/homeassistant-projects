  - "The room being cleaned stands out; dock, no-go and no-mop zones, virtual walls and optional obstacles"
  - "3D view with raised walls, to turn and zoom, and a full screen button"
  - "Local only: the map the Roborock integration already fetches, never through the cloud"
  - "Card bundled with the integration, visual editor, rotation by 90°, embedded mode for other cards"
  - "Diagnostics holding the raw map to reproduce a rendering issue"
  - "Animated illustrated header with the state as a status pill"
