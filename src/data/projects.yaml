- slug: ha-system-hub
  title: System Hub
  kind: integration
  withCard: true
  category: maintenance
  icon: mdiHomeAnalytics
  accent: '#03a9f4'
  tagline: 'The care of your Home Assistant in one admin panel: resources, updates, backups, logs, security, devices and Git.'
  summary: 'One integration and one sidebar panel for everything that keeps Home Assistant healthy: System Monitor resources, Home Assistant''s own containers, the database, security, logs, every update, backups, the integration sentinel, silent devices, batteries, Git versioning, failed automations and cleanup. Each feature is a module you turn on or off, in four groups, with a Status tab that sums them up.'
  highlights:
  - 'Status tab: an emblem, the points to check and a score, each area by group; the sidebar icon follows the status'
  - 'Panel in four groups: System, Reliability, Maintenance and Devices, the modules as sub-tabs, ordered as you like'
  - 'Resources: System Monitor sensors, reload the configuration, restart Home Assistant or reboot the host, each confirmed, from the panel or the System Monitor card'
  - 'Containers: Home Assistant Core, the Supervisor and every add-on, with state, version, CPU and memory; monitoring only'
  - 'Database: size, retention and the devices that write the most, each unfolding to its entities, purge their history or copy the recorder exclusion, purge and repack'
  - 'Security: refused logins with notifications, accounts and 2FA, long-lived tokens to revoke, exposure, add-ons not protected, credentials in clear'
  - 'Logs: errors and warnings grouped by integration, with their traceback, reload or ignore'
  - 'Updates: Home Assistant, add-ons, devices and the Marketplace in one tab, Update all with an optional backup first'
  - 'Backups: the last one, the next one, each location and the last 30 days, Back up now'
  - 'Sentinel: reloads the integrations whose entities are all unavailable, power cycles through a smart plug'
  - 'Silent devices: ZHA, Zigbee2MQTT, Z-Wave, Matter, ESPHome and deCONZ devices not heard from, and weak signals'
  - Batteries, Versioning (Git) of the configuration, failed automations and Cleanup of orphan entities and devices
  - One card and one mini card for every module, status cards included, the visual editor picking the module first
  - A module turned on takes over the settings of the standalone integration it replaces
  - Diagnostics of every module, secrets redacted; 23 languages
  homeassistant: 2024.12.0
  keywords: "system monitor containers add-ons supervisor database recorder security logs updates backups sentinel watchdog reload silent devices zigbee batteries git versioning automations cleanup orphans panel admin modules status"
