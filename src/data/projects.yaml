- slug: ha-weather-card
  title: Weather Plus Card
  kind: card
  category: climate
  icon: mdiWeatherPartlyCloudy
  accent: '#f5a623'
  tagline: An animated weather card that gathers everything your weather integrations know.
  summary: Animated day and night scenes, rain in the next hour, weather warnings, lightning nearby, air quality, UV, pollen, sun and moon, all in one card with a compact mini version.
  highlights:
  - Animated scene for every condition, by day and by night, with the real moon phase
  - Rain in the next hour, hourly and daily forecasts
  - Weather warnings, lightning nearby, drought restrictions
  - Air quality, pollutants, UV index and pollen with tomorrow's forecast
  - Full screen view and a refresh button for fresh data
