- slug: ha-energy-card
  title: Energy Card
  kind: card
  category: home
  icon: mdiSolarPowerVariant
  accent: '#f9a825'
  tagline: 'Solar inverters and home batteries from Enphase, SolarEdge, Fronius, Huawei, SMA, Tesla and more: live power flow, battery, today.'
  summary: 'Works on top of the integrations you already use (Enphase Envoy, SolarEdge, Fronius, Huawei Solar, SMA, Tesla Powerwall, Growatt, APsystems, SolaX, GoodWe) and any other power sensors, with automatic discovery and each integration''s sign conventions handled: live power flow between the sun, the grid, the home and the battery, battery level and time left, today''s energy, self-consumption and self-sufficiency, and the integration''s switches.'
  highlights:
  - Enphase, SolarEdge, Fronius, Huawei, SMA, Tesla Powerwall, Growatt, APsystems, SolaX and GoodWe supported, plus any power sensors
  - Live power flow between the sun, the grid, the home and the battery, in the energy dashboard colours
  - Triangle layout without a battery, or without solar panels; grid outage shown crossed out
  - Battery level with the backup reserve, charging or discharging power and time to full or to the reserve
  - Produced, consumed, imported, exported, charged and discharged energy today, self-consumption and self-sufficiency
  - The integration's switches and selects (charge from the grid, off-grid, work mode) with a confirmation
  - Every role discovered automatically, or set by hand
  - Mini card with a detail button switching to the full card
  homeassistant: 2024.8.0
  keywords: "solar photovoltaic pv panneaux solaires inverter onduleur battery batterie powerwall enphase solaredge fronius huawei sma growatt apsystems solax goodwe energy"
