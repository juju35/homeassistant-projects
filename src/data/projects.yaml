  summary: 'Some integrations lose their connection and never recover until reloaded by hand. Integration Watchdog does it for you, safely: never during startup, never in a loop.'
  highlights:
  - Periodic check of every loaded integration
  - Reload after a grace period
  - Never during startup, no reload loop
  - Notification for each reload, dismissed once the integration recovers
  - Ignored integrations and single entries
  - Reloads of the last 24 hours as a sensor
  - Repairs issue when it gives up on an integration
  - Try again from Repairs or the card, running in the background, and a reset action, to start an integration's reloads over
  - Diagnostics with titles and notify actions redacted
  - Card with the overall status, the unavailable integrations and the recent reloads
  - 'Pause entity: nothing is reloaded while it is on (maintenance, the night)'
  - Grace period per integration, for one that takes longer to come back
  - Mini card on two lines, with a detail button showing the full card
  - 'Power cycles: a device that stays unavailable is switched off and on again with the smart plug that powers it, with the same safeguards'
  - Sidebar panel for administrators with the status, the power cycles and every setting
