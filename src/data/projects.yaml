- slug: ha-hp
  title: HP Printer
  kind: integration
  category: appliances
  icon: mdiPrinterWireless
  accent: '#0096d6'
  tagline: HP printers fully local, with sensors that keep their values while the printer sleeps, and scanning to PDF.
  summary: 'Status, ink or toner levels, pages remaining and page counters from the printer''s built-in web server, and scanning to PDF, JPEG or PNG from the glass or the feeder, multi-page PDFs included. Built to replace the core HP Printer integration where it is fragile: no unavailable entities when the printer is off, nothing written when nothing changes.'
  highlights:
  - Last values kept while the printer is off or asleep, and across a restart; only the status turns off
  - Page counters that never go down, for clean long-term statistics
  - Tiered polling, ETags and at most two requests at a time, light on the printer
  - Status never unknown, paper jams and open doors recognized, cartridge details on each level sensor
  - 'Scan to PDF, JPEG or PNG: glass, feeder or double-sided feeder, resolution, color mode and page size, Scan and add page'
  - Last scan as a sensor and an image, files downloaded through signed links then deleted
  - Zeroconf discovery following address changes, reconfigure, firmware updates, diagnostics
  - No Python dependency; 22 languages
  homeassistant: 2025.8.0
  keywords: "hp printer officejet envy deskjet laserjet smart tank ink toner pages scan scanner escl airscan pdf local"
  worksWith:
  - slug: ha-printer-card
    why: "Shows its printers, with their last values while off and the Scan section"
