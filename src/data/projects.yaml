- slug: ha-git-sync
  title: Git Sync
  kind: integration
  withCard: true
  category: maintenance
  icon: mdiSourceBranchSync
  accent: '#f05032'
  tagline: Versions your Home Assistant configuration with Git, without shell commands.
  summary: Watches the configuration folder, commits and pushes the changes on a schedule with an AI-written Conventional Commits message, exports the dashboards out of .storage, and ships a card to follow and drive it all. It replaces the usual shell_command, command_line sensor, script and automation stack.
  highlights:
  - Work tree status, changed files, commits ahead and behind
  - Commit and push on a schedule or on demand
  - Remote fetched on a schedule, behind and diverged states
  - Pull before push, a diverged branch or a rebase conflict never pushed
  - Pull button and action bringing in the remote commits whenever the remote has new ones
  - Secret guard refusing secrets.yaml, .storage, keys and logs, secret values hidden from the AI
  - Repair adding secrets.yaml and .storage to .gitignore
  - AI commit messages through any AI task entity, with a safe fallback
  - Dashboards exported as JSON or readable YAML, daily or before each commit
  - SSH deploy key generated by an action, no ssh-keyscan needed
  - Diagnostics with the key path, author and credentials redacted
  - Card with the status, the last commit and push, the changed files, and a ✨ button that writes the message before committing
  - Actions in the cards for administrators only, other users seeing the status
  - Full screen diff, file by file, like a code editor
  - Mini card for a compact dashboard, with a detail button showing the full card
