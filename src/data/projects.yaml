- slug: ha-weather-card
  title: Weather Plus Card
  kind: card
  category: climate
  icon: mdiWeatherPartlyCloudy
  accent: '#f5a623'
  tagline: An animated weather card that gathers everything your weather integrations know.
  summary: Animated day and night scenes, rain in the next hour, weather warnings, lightning nearby, air quality, UV, pollen, sun and moon, all in one card with a compact mini version.
  highlights:
  - Animated scene for every condition, by day and by night, with the real moon phase
  - Rain in the next hour, hourly and daily forecasts
  - Weather warnings banner from Meteoalarm, GeoSphere Austria, DWD, NWS or Météo-France, lightning nearby, drought restrictions
  - Air quality, pollutants, UV index and pollen with tomorrow's forecast
  - "Moon phase, age, moonrise and moonset, next full and new moons from Lunar Phase when it is installed"
  - "Wind rose of the last 24 hours from a weather station (Netatmo, Ecowitt, WeatherFlow, Davis…), with gusts and the dominant direction"
  - "Any section as a card of its own, without the header or the weather now"
  - Full screen view and a refresh button for fresh data
  - Today and the sun and moon times in the server time zone when your profile uses it
  - Animations paused while the card is off-screen
