  kind: integration
  withCard: true
  category: home
  icon: mdiBellBadge
  accent: '#2563eb'
  tagline: "One hub in front of all your notifications: who gets it, on which phone, and when."
  summary: "Your automations call one action with a priority, and the hub decides who gets the notification, on which phone and when: quiet hours, duplicates dropped, low-priority messages grouped in a digest, critical ones escalated until someone acknowledges them. Every notification is filed under its source, with rules per integration. A sidebar panel shows the journal and sets the rules; a card shows what happened today."
  highlights:
  - "One action for every automation, notify_hub.send, with four priorities: critical, alert, info and digest"
  - "A notify target for every integration: notify.notify_hub can be picked wherever a notify service is asked for"
  - "People, not phones: each person's phones found from their person entity"
  - "Quiet hours, duplicates dropped, digests at the times you choose and an away mode"
  - "Critical notifications with an Acknowledge button, escalated to everyone then to an SMS service, cleared on every phone once acknowledged"
  - "Sources found by themselves from the calling automation, with rules per source: people, forced priority, quiet hours ignored, muted"
  - "Home Assistant's persistent notifications and new repairs captured too, if you like"
  - "Sidebar panel with the journal, routing, rules, sources and settings, and a count while something waits for an acknowledgement"
  - "On scroll, the panel's top bar folds into a compact sticky bar with round icon tabs"
