- slug: ha-smart-comfort
  title: Smart Comfort
  kind: integration
  withCard: true
  category: climate
  icon: mdiHomeThermometer
  accent: '#26a69a'
  tagline: Fewer, smarter comfort alerts and automatic control of climate devices, room by room.
  summary: 'Tracks each comfort problem as an episode: notified once when it starts, again only if it gets worse. Temperature, CO₂, humidity, noise and windows to open or close, with a dedicated panel to set up every room.'
  highlights:
  - 'Ten alerts per room: heat, cold, windows, CO₂, humidity, noise'
  - Episodes instead of cooldowns, with hysteresis and delay
  - One digest notification listing every current problem
  - Quiet hours, presence and iOS / Android interruption levels
  - Automatic control of air conditioners, fans and purifiers
  - Setup panel with room discovery
  homeassistant: 2024.12.0
  hero:
    src: panel-overview.png
    dark: panel-overview-dark.png
    caption: Overview of the Smart Comfort panel
  screenshots:
  - src: panel-start.png
    caption: Discover offered in the overview while nothing is set up
  - src: panel-discover.png
    caption: Rooms found by Discover, before saving
  - src: panel-room.png
    caption: A room in the Smart Comfort panel
  - src: panel-outdoors.png
    caption: The outdoor places, below the rooms
  - src: panel-alerts.png
    caption: Alert settings in the Smart Comfort panel
