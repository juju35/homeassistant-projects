  - Homework calendar and a to-do list per child, ticking an item marks the homework done in the portal
  - Messages and homework unfold to their text and attachments, images shown and PDFs opened through Home Assistant
  - Reply to the teacher in each message's private conversation, or write a new message to the teacher
  - Answer surveys for the children concerned, and change the answer until the deadline
