- slug: ha-findmy
  title: Find My
  kind: integration
  category: security
  icon: mdiRadar
  accent: '#34c759'
  tagline: "Your Apple devices from iCloud and your AirTags from the Find My network, with their position, battery and last seen time."
  summary: "An integration for Apple's Find My with two sources: an iCloud account for iPhone, iPad, Mac, Apple Watch and AirPods (and the family's devices), with Play sound, Display message and Lost Mode; and a Find My network account for AirTags and Find My accessories, imported all at once from the data exported from a Mac. Positions and batteries survive restarts and the hours Apple has nothing new, and an expired Apple session asks to sign in again on its own."
  highlights:
  - "iCloud devices: position, battery, charging, status and Lost Mode, with a Play sound button"
  - "AirTags and accessories: position, battery state and last seen time, decrypted from the Find My network"
  - "Every accessory of a Mac export added at once, with its name and key alignment"
  - Verification codes by trusted device or text message, and a sign-in prompt as soon as Apple ends the session
  - Last position, battery and last seen time kept across restarts and failed fetches
  - Home Assistant stays responsive while accessory keys are derived and reports decrypted
  - Display message, Lost Mode and refresh actions
  - Light on Apple, 15 minutes between Find My network fetches
  - "23 languages: French, English, German, Spanish, Italian, Dutch and more"
  homeassistant: 2026.6.0
  wip: true
  wipNote: "Every part is covered by tests; it still needs to be tried on real iCloud accounts and AirTags."
  keywords: "localiser find my apple icloud airtag airtags airpods iphone ipad mac apple watch traceur balise tag clés objet perdu tracker mode perdu lost mode faire sonner play sound localisation position device tracker famille family sharing"
  worksWith:
  - slug: ha-tracker-card
    why: "Its AirTags on the radar, with their last seen time and battery"
  - slug: ha-presence-card
    why: "Where the family's iPhones are"
- slug: ha-alarm-card
  title: Alarm Card
  kind: integration
  withCard: true
  category: security
  icon: mdiShieldHome
  accent: '#e5484d'
  tagline: "Arm and disarm an alarm from its cards, and set Alarmo up in an Alarm panel: state, delays, code pad, open sensors and a timeline."
  summary: An integration that serves the alarm cards and adds an Alarm panel to the sidebar, to set up Alarmo in the cards' style. The cards work with any alarm control panel (Alarmo, Manual, Verisure, Ajax…). The arm modes come from the panel's features, and the shield pulses during delays and flashes when the alarm goes off.
  highlights:
  - One button per supported arm mode
  - Exit and entry delay countdown with a progress bar
  - Code pad when the panel needs a code
  - Open sensors and the last person who changed the state
  - Activity of the latest arm, disarm and trigger changes, with who made them
  - Alarmo refusing to arm lists the open sensors, with Arm anyway
  - "Mini card: the 90 px banner alone, its arm and disarm buttons beside the radar"
  - Cameras of your choice, their snapshots shown while the alarm is triggered or counting down
  - Buttons section with switches, lights, scripts and scenes of your choice, such as the plugs of the cameras
  - Display names for the sensors, cameras and buttons, set in the visual editor
  - "A frosted-glass shield in the state colour, its padlock opening when disarmed and locking when armed"
  - "Surveillance radar header around the big state shield, its sweep, sensors and camera following the alarm"
  - "Alarm sidebar panel for administrators, with the tabs and settings of Alarmo's own panel: General, Sensors, Codes and Actions"
  - "Timeline tab: the activity of the alarm's sensors over 6 h, 24 h or 3 days, room by room, the armed periods shaded"
  - "The panel's top bar is the card's surveillance radar, with a round button per arm mode and Disarm"
  - "On scroll, the panel's top bar folds into a compact sticky bar with round icon tabs"
  - "A count on the sidebar: the sensors keeping the alarm from arming, red while it is triggered"
  homeassistant: 2024.12.0
  keywords: "alarmo alarm control panel security verisure ajax manual buttons switch panel timeline sensors codes"
