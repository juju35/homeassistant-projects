  - Try again from Repairs or the card, running in the background, and a reset action, to start an integration's reloads over
  - Diagnostics with titles and notify actions redacted
  - Card with the overall status, the unavailable integrations and the recent reloads
  - Mini card on two lines, with a detail button showing the full card
