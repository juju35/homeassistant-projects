- slug: ha-house-rules
  title: House Rules
  kind: integration
  withCard: true
  category: home
  icon: mdiHomeLightningBolt
  accent: '#4f46e5'
  tagline: "The reflexes of your home as rules: plugs, alert lights, the vacuum's lights, appliances, chimes and leaks, with a panel and cards."
  summary: "Replaces the automations of every small reflex of the home: plugs kept on or turned off after a while, lights flashing while a sensor is triggered, lights following the robot vacuum from room to room, appliances powered back on when cut mid-programme, chimes, end-of-cycle reminders, leak guard, lights on presence and lock guard. Each one is a rule that keeps its state across restarts, shares global conditions and logs what it does, set up in a sidebar panel or in house_rules.yaml, both ways."
  highlights:
  - "11 rule types, each with its enabled switch, state sensor and test button"
  - "house_rules.yaml edited both ways: the panel rewrites only the rule it saves, comments kept, and a change in the file restarts only the rules that changed"
  - "Global conditions: quiet hours, nobody home, alarm armed, vacation mode"
  - "Light arbitration: a light goes off only when no rule wants it any more, and never when it was on before"
  - "Escalation of an alert: flash, then a chime, then a critical notification"
  - "Repairs when a rule gives up or the YAML is invalid, the last valid configuration running on"
  - "Import from the plug labels, from recognised automations (turned off, never deleted) and from Smart Comfort's lights on presence"
  - "Naps shared with Smart Comfort through a schedule helper per room"
  - "Sidebar panel with Activity, Rules, Rooms, Journal, YAML and Settings tabs, and a count badge"
  - "Presence lights in the Activity tab: a tile per room lit by presence, a countdown to the switch-off once it is empty, +15 min and Turn off"
  - "On scroll, the panel's top bar folds into a compact sticky bar with round icon tabs"
  - "Overview card and mini card, timers and activity cards, under an illustrated header with one object per family of rules"
  - "20 languages"
  - "Rooms tab with a folding card per room, filled from the Home Assistant areas with Discover"
  homeassistant: 2024.12.0
