- slug: ha-climate-air-card
  title: Climate Air Cards
  kind: card
  category: climate
  icon: mdiAirConditioner
  accent: '#039be5'
  tagline: Cards for heat pumps, air conditioners, air purifiers, humidifiers, diffusers, ventilation units and fans, with an overview of every device.
  summary: One card per kind of device, each with a mini card, and an overview of the whole home. Add a card and it finds the device and its sensors by itself; the illustrations come alive while a device runs.
  highlights:
  - Air purifier, fan, air conditioner, heat pump and humidifier cards, each with a mini card
  - "Humidifiers, dehumidifiers and essential oil diffusers: water tank, empty tank and full bucket alerts, large illustrations including the VOCOlinc MistFlow and FlowerBud"
  - "VOCOlinc FlowerBud: mist intensity and a mood light section (brightness, colours) usable while it is off, its cone lit in the light's colour"
  - "Air-to-water heat pumps: hot water tank, three-way valve, defrost and backup heater, Aldes T.One through TOUG included"
  - "Filter life always shown, purifiers and air conditioners alike, a replace-soon alert and a filter reset button"
  - "Ventilation units (MVHR and extract): the heat recovered, the four air streams through the exchanger with their temperatures, levels, boost, bypass and filter, Zehnder ComfoAir Q, Duco, Renson, Vallox and Prana included"
  - Overview of every device, grouped by kind or by area
  - 'Animated illustrations: turning blades, air flowing, swinging head, a heat pump outdoor unit feeding its tank'
  - Automatic discovery of devices and their sensors
  - Heat / cool range of air conditioners on the overview
  - Horizontal swing for the air conditioners that support it
  - Target humidity slider for the air conditioners that support it
  - Sliders showing their fill and value while they move
  - Chips opening the more-info dialog of their entity
  - "Multi-zone heat pumps: a setpoint per room, centred steppers, hot water read from sensors and a fault chip"
  - "Midea PortaSplit air conditioner and Rituals Perfume Genie diffuser (brass or black) drawn as they are, a localised Genie included"
  - "Ground- and water-source heat pumps: horizontal collector, borehole, well, doublet or lake loop drawn in place of the outdoor unit, the brine or water flowing while it runs"
  - "Heat pumps measured but not controlled: a read-only card from a power sensor, with heat output, COP and SCOP, flow and return temperatures"
  - "Ceiling fans hanging in the room, the blades turning with the speed and the other way when reversed, with their light and direction (Bond, Big Ass Fans, Modern Forms…)"
  homeassistant: 2024.8.0
