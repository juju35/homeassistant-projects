# Source of the site: one entry per Home Assistant project.
# Screenshot paths are relative to the screenshots/ folder of each repository (main branch).
# group: the tab a screenshot is shown under on the project page (one card or variant per tab).
categories:
- id: climate
  label: Climate & weather
  icon: mdiWeatherPartlyCloudy
- id: home
  label: Home & energy
  icon: mdiHomeLightningBolt
- id: security
  label: Security & presence
  icon: mdiShieldHome
- id: appliances
  label: Appliances
  icon: mdiWashingMachine
- id: network
  label: Network & servers
  icon: mdiServerNetwork
- id: car
  label: Car & fuel
  icon: mdiCar
- id: everyday
  label: Everyday
  icon: mdiCalendarMonth
- id: maintenance
