- slug: ha-smart-comfort
  title: Smart Comfort
  kind: integration
  withCard: true
  category: climate
  icon: mdiHomeThermometer
  accent: '#26a69a'
  tagline: 'Fewer, smarter comfort alerts, and climate devices and lights that adjust themselves, room by room.'
  summary: 'Tracks each comfort problem as an episode: notified once when it starts, again only if it gets worse. Temperature, CO₂, humidity, noise, indoor and outdoor air quality and windows to open or close, automatic control of air conditioners, fans and purifiers with a quiet night, and adaptive lighting. Everything is set up room by room in its own panel.'
  highlights:
  - Eleven alerts per room for heat, cold, windows, CO₂, humidity, polluted air, noise and outdoor air; no cold-window alert while a room airs out
  - Indoor air quality from PM2.5, PM10 and air quality index sensors per room, the purifiers' own sensors found by Discover
  - Polluted air alert with its reading, the room's purifiers boosted until the air is clean, then back to their previous state
  - Episodes instead of cooldowns, grouped in one digest notification
  - Quiet hours, presence and iOS / Android interruption levels, with Snooze and Got it buttons
  - Air conditioners, fans and purifiers controlled automatically, quieter at night
  - Adaptive lighting by time of day, with a quiet morning and nap slots per room
  - Lights on presence, with time slots, night lights and a color per slot
  - Outdoor places and air quality index to suggest opening or closing the windows
  - Setup panel in the sidebar, with room discovery, a day schedule and the YAML of the setup
  - Activity log in the panel and in an activity card for the dashboard
  - Diagnostics with the notifiers redacted
  - Calendar of past alerts, with the peak of each episode
  - Mini card with the alerts of the moment and the switches, opening the full card
  - Full card a section wide, with every alert, a tile per room, the switches and the latest activity
  - Comfort score per room, 0 to 100 %, with its statistics for the day or the week
  homeassistant: 2024.12.0
  keywords: "comfort notifications alerts co2 humidity temperature noise pm2.5 pm10 air quality purifier windows lights lighting adaptive presence motion nap night activity log mini card"
  worksWith:
  - slug: ha-climate-air-card
    why: "Shows the air conditioners, fans and purifiers it drives"
  - slug: ha-room-card
    why: "Room by room view of the sensors behind its comfort alerts"
  cardTypes:
