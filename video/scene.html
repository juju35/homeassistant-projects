<!--
  Scenes of the presentation video (see video/README.md).
  Visible text is written in English here; other languages replace exact snippets with the
  `ui` pairs of video/i18n/<lang>.yaml — when you change an English string, update its pair.
  Loaded by video/render.py from video/.cache/, so asset paths are relative to that folder.
-->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f4f6fb;font-family:Inter,sans-serif;color:#1d2330}
#root{position:absolute;inset:0}
.glow{position:absolute;inset:0}
.abs{position:absolute}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.tile{box-shadow:0 4px 16px rgba(30,40,80,.07);position:absolute;width:378px;height:96px;border-radius:18px;background:#ffffff;border:1px solid #e3e7ef;display:flex;align-items:center;padding:0 18px;gap:16px}
.tile .pill{width:52px;height:52px;flex:none}
.tile .t{font-weight:650;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .k{font-size:15px;margin-top:5px;font-weight:500}
.hdr{position:absolute;left:80px;top:70px;width:772px;height:210px;border-radius:24px;overflow:hidden}
.shot{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(30,40,80,.16);border:1px solid #e3e7ef;background:#ffffff}
.shot img{width:100%;height:100%;display:block}
.cap{position:absolute;font-size:22px;font-weight:600;color:#3b4352;text-align:center}
.chip{box-shadow:0 4px 16px rgba(30,40,80,.08);display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;background:#ffffff;border:1px solid #e3e7ef;font-size:24px;font-weight:550}
.lt{display:flex;align-items:center;justify-content:center;border-radius:14px;background:#fff;border:1px solid #e3e7ef;box-shadow:0 3px 10px rgba(30,40,80,.08);padding:9px;flex:none}
.lt img{max-width:100%;max-height:100%;object-fit:contain}
.lt.more{background:#eef1f6;border:1px solid #e3e7ef;color:#3b4352;font-weight:700;font-size:20px}
.bt2{flex:none;border-radius:18px;background:#ffffff;box-shadow:0 4px 18px rgba(30,40,80,.08);border:1px solid #e6e9f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.bt2 .lg{height:60px;width:120px;display:flex;align-items:center;justify-content:center}
.bt2 .lg img{max-width:100%;max-height:100%;object-fit:contain}
.bt2 .bnm{font-size:14px;font-weight:600;color:#3b4250;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:700;color:#d97706;padding:5px 12px;border-radius:999px;background:rgba(251,191,36,.12)}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block}
.tile .k{margin-top:3px}
</style></head><body><div id="bg" style="position:absolute;inset:-200px"></div><div id="root"></div>
<script>
const P=new URLSearchParams(location.search);const SC=+P.get('scene');
let D;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const svg=(name,size,color)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path fill="${color}" d="${D.icons[name]}"/></svg>`;
const hex=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
const kindFr={card:'Card',integration:'Integration',theme:'Theme'};
const root=document.getElementById('root');
const $=id=>document.getElementById(id);
let DUR=6;
const preload=[];
// GIF players: canvas + preloaded frames
const players={};
function gifCanvas(id,g,w,h,css){
  const dark=g.startsWith('D:');const gg=dark?g.slice(2):g;const m=D.gifmeta[g];const imgs=m.map((_,i)=>{const im=new Image();im.src=`${dark?'frames-dark':'frames'}/${gg}/${String(i).padStart(3,'0')}.png`;preload.push(im);return im});
  players[id]={imgs,m,total:m.reduce((a,b)=>a+b,0),w,h,last:-1};
  return `<canvas id="${id}" width="${w}" height="${h}" style="${css}"></canvas>`;
}
function play(id,ms){const p=players[id];let t=((ms%p.total)+p.total)%p.total,i=0;while(i<p.m.length-1&&t>=p.m[i]){t-=p.m[i];i++}
  if(i!==p.last){const c=$(id).getContext('2d');c.clearRect(0,0,p.w,p.h);c.drawImage(p.imgs[i],0,0);p.last=i}}
const fadeAll=(t)=>{root.style.opacity=clamp(t/.3)*(1-clamp((t-(DUR-0.35))/.35))};
const rise=(id,t,d,dy=20,dur=.5)=>{const e=$(id);const x=ease((t-d)/dur);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*dy}px)`};
const logoTile=(b,size,cls='')=>`<div class="lt ${cls}" style="width:${size}px;height:${size}px"><img src="${b.file}"></div>`;

function buildIntro(){
  DUR=7;
  const all=D.cats.flatMap(c=>c.projects);
  let h=`<div class="glow" style="background:radial-gradient(900px 600px at 50% 45%, rgba(3,169,244,.20), transparent 70%)"></div>`;
  let k=0;
  for(let r=0;r<9;r++)for(let c=0;c<16;c++){const p=all[(k*7)%all.length];k++;
    h+=`<div class="abs pill fi" data-r="${r}" data-c="${c}" style="left:${c*124+18}px;top:${r*124}px;width:72px;height:72px;background:${hex(p.a,.13)}">${svg(p.i,38,hex(p.a,.75))}</div>`}
  h+=`<div class="abs" style="inset:0;background:radial-gradient(820px 470px at 50% 52%, rgba(244,246,251,.96) 45%, rgba(244,246,251,.55) 100%)"></div>`;
  h+=`<div class="abs" id="logo" style="left:0;right:0;top:170px;text-align:center">${svg('mdiHomeAssistant',100,'#18bcf2')}</div>`;
  h+=`<div class="abs" id="ttl" style="left:0;right:0;top:295px;text-align:center;font-size:84px;font-weight:800;letter-spacing:-2px">My Home Assistant projects</div>`;
  h+=`<div class="abs" id="by" style="left:0;right:0;top:405px;text-align:center;font-size:30px;color:#566073;font-weight:500">Cards, integrations and themes · by Julien (juju35)</div>`;
  const st=[[D.counts.total,'projects','#1d2330'],[D.counts.cards,'cards','#6b7385'],[D.counts.integ,'integrations','#2563eb'],[D.counts.themes,'themes','#c2387f']];
  st.forEach((s,i)=>{h+=`<div class="abs" id="n${i}" style="left:${330+i*330}px;top:500px;width:270px;text-align:center"><div class="num" style="font-size:72px;font-weight:800;color:${s[2]}">0</div><div style="font-size:26px;color:#566073">${s[1]}</div></div>`});
  const ch=[['mdiHandshakeOutline',D.counts.brands,'supported brands and integrations','#0d9488'],['mdiAnimationPlayOutline',D.counts.anims,'animations','#d97706'],['mdiDockLeft',D.counts.panels,'sidebar panels','#7c3aed']];
  h+=`<div class="abs" style="left:0;right:0;top:720px;display:flex;justify-content:center;gap:24px">${ch.map((c,i)=>`<div class="chip" id="ch${i}" style="font-size:28px;padding:18px 30px">${svg(c[0],34,c[3])}<b class="num2" style="color:${c[3]};font-weight:800">${c[1]}</b> ${c[2]}</div>`).join('')}</div>`;
  root.innerHTML=h;
  const fis=[...document.querySelectorAll('.fi')];
  return t=>{
    fis.forEach(e=>{const r=+e.dataset.r,c=+e.dataset.c;const d=Math.hypot(r-4,(c-7.5)/1.4)*.08;const x=ease((t-d)/.6);e.style.opacity=x*.5;e.style.transform=`translate(${-t*10}px,${Math.sin(t*.8+c)*5}px) scale(${.6+.4*x})`});
    const lg=$('logo');lg.style.opacity=ease((t-.3)/.5);lg.style.transform=`scale(${.7+.3*ease((t-.3)/.6)})`;
    rise('ttl',t,.6);rise('by',t,.9);
    st.forEach((s,i)=>{const e=$('n'+i);const x=(t-1.3-i*.15)/1.2;e.style.opacity=ease(x*3);e.querySelector('.num').textContent=Math.round(s[0]*easeIO(x))});
    ch.forEach((c,i)=>{rise('ch'+i,t,2.6+i*.25,24);$('ch'+i).querySelector('.num2').textContent=Math.round(c[1]*easeIO((t-2.6-i*.25)/1.2))});
    fadeAll(t);
  };
}

function buildBrands(){
  DUR=9;
  const B=D.brandsAll;const rows=6,TW=168,TH=118,G=18;
  let h=`<div class="glow" style="background:radial-gradient(1000px 500px at 50% 0%, rgba(20,184,166,.20), transparent 70%)"></div>`;
  h+=`<div class="abs" id="bt" style="left:0;right:0;top:70px;text-align:center;font-size:72px;font-weight:800;letter-spacing:-1.5px"><span id="bn" style="color:#0d9488">0</span> brands and integrations</div>`;
  h+=`<div class="abs" id="bs" style="left:0;right:0;top:170px;text-align:center;font-size:30px;color:#566073;font-weight:500">Every card adapts to the integrations you already have: Roborock, Shelly, Matter, Tesla, Freebox…</div>`;
  const per=Math.ceil(B.length/rows);
  for(let r=0;r<rows;r++){
    const items=B.slice(r*per,(r+1)*per);
    h+=`<div class="abs brow" id="r${r}" style="top:${250+r*(TH+G)}px;left:0;height:${TH}px;display:flex;gap:${G}px">`+
      [...items,...items].map(b=>`<div class="bt2" style="width:${TW}px;height:${TH}px"><div class="lg"><img src="${b.file}"></div><div class="bnm">${b.name}</div></div>`).join('')+`</div>`;
  }
  h+=`<div class="abs" style="left:0;top:240px;bottom:0;width:180px;background:linear-gradient(90deg,#f4f6fb,transparent)"></div><div class="abs" style="right:0;top:240px;bottom:0;width:180px;background:linear-gradient(270deg,#f4f6fb,transparent)"></div>`;
  root.innerHTML=h;
  const W=per*(TW+G);
  return t=>{
    rise('bt',t,.1);rise('bs',t,.5);
    $('bn').textContent=Math.round(D.counts.brands*easeIO((t-.2)/1.8));
    for(let r=0;r<rows;r++){const e=$('r'+r);const sp=60+((r*37)%5)*12;const dir=r%2?1:-1;
      let x=(dir<0? -(t*sp) : -W + t*sp) - (r*113)%400;
      e.style.transform=`translateX(${x}px)`;e.style.opacity=ease((t-.4-r*.1)/.6)}
    fadeAll(t);
  };
}

function buildCat(c){
  DUR=7.5;
  let h=`<div class="glow" style="background:radial-gradient(1100px 700px at 75% 45%, ${hex(c.accent,.18)}, transparent 70%),radial-gradient(700px 500px at 10% 10%, ${hex(c.accent,.10)}, transparent 70%)"></div>`;
  h+=`<div class="hdr" id="hdr" style="top:56px;background:linear-gradient(135deg, ${hex(c.accent,1)} 0%, ${hex(c.accent,.72)} 100%);box-shadow:0 14px 40px ${hex(c.accent,.28)};color:#fff">
    <div class="abs" id="s0" style="right:70px;top:26px;opacity:.9">${svg(c.scene[0],130,'rgba(255,255,255,.92)')}</div>
    <div class="abs" id="s1" style="right:215px;top:34px;opacity:.55">${svg(c.scene[1],60,'rgba(255,255,255,.9)')}</div>
    <div class="abs" id="s2" style="right:14px;top:36px;opacity:.5">${svg(c.scene[2],56,'rgba(255,255,255,.9)')}</div>
    <div class="abs" style="left:0;right:0;bottom:0;height:12px;background:rgba(0,0,0,.18)"></div>
    <div class="abs pill" style="left:30px;top:34px;width:64px;height:64px;background:rgba(255,255,255,.22)">${svg(c.icon,36,'#fff')}</div>
    <div class="abs" style="left:30px;top:118px;font-size:36px;font-weight:750;letter-spacing:-.5px;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.25)">${c.label}</div>
    <div class="abs" style="left:112px;top:46px;font-size:20px;font-weight:600;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.25)">${c.projects.length} projects</div>
  </div>`;
  h+=`<div class="abs" id="sub" style="left:82px;top:284px;width:780px;font-size:23px;color:#566073;font-weight:500">${c.sub}</div>`;
  c.projects.forEach((p,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const kc=p.k==='integration'?'#2563eb':p.k==='theme'?'#c2387f':'#6b7385';
    h+=`<div class="tile" id="t${i}" style="left:${80+col*394}px;top:${334+row*94}px;height:82px">
      <div class="pill" style="background:${hex(p.a,.2)}">${svg(p.i,30,p.a)}</div>
      <div style="min-width:0"><div class="t">${p.t}</div><div class="k" style="color:${kc}">${kindFr[p.k]}</div></div></div>`;
  });
  // brand strip
  const NB=11, br=c.brands.slice(0,NB), more=c.brands.length-br.length;
  if(br.length){
    h+=`<div class="abs" id="bl" style="left:82px;top:912px;font-size:19px;font-weight:600;color:#6b7385;letter-spacing:.3px">WORKS WITH</div>`;
    h+=`<div class="abs" style="left:80px;top:944px;display:flex;gap:10px">${br.map((b,i)=>`<div class="lt" id="b${i}" style="width:60px;height:60px"><img src="${b.file}"></div>`).join('')}${more>0?`<div class="lt more" id="bm" style="height:60px;padding:0 14px;width:auto">+${more}</div>`:''}</div>`;
  }
  const BX=930,BY=70,BW=910,BH=850;
  c.anims.forEach((f,i)=>{
    const s=Math.min(BW/f.w,BH/f.h,f.type==='gif'?1.8:1.25);
    const w=f.w*s,hh=f.h*s;const L=BX+(BW-w)/2,T=BY+(BH-hh)/2;
    const inner=f.type==='gif'?gifCanvas('g'+i,f.gif,f.w,f.h,'width:100%;height:100%;display:block'):`<img src="${f.src}">`;
    h+=`<div class="shot" id="f${i}" style="left:${L}px;top:${T}px;width:${w}px;height:${hh}px;${f.type==='gif'?'background:transparent;border:none;box-shadow:0 30px 80px rgba(30,40,80,.14)':''}">${inner}</div>`;
    h+=`<div class="cap" id="c${i}" style="left:${BX}px;width:${BW}px;top:${BY+BH+46}px;display:flex;justify-content:center;align-items:center;gap:14px">
      ${f.type==='gif'?`<span class="tag">${svg('mdiPlayCircleOutline',20,'#d97706')} Animation</span>`:''}<span>${f.title}${f.cap?` <span style="color:#8a92a3">· ${f.cap}</span>`:''}</span></div>`;
  });
  root.innerHTML=h;
  const n=c.anims.length;
  return t=>{
    const hd=$('hdr');hd.style.opacity=ease(t/.5);hd.style.transform=`translateY(${(1-ease(t/.6))*-30}px)`;
    for(let k=0;k<3;k++){$('s'+k).style.transform=`translate(${Math.sin(t*0.9+k*2)*6 - t*2*(k+1)}px,${Math.cos(t*1.1+k)*4}px)`}
    $('sub').style.opacity=ease((t-.3)/.5);
    c.projects.forEach((p,i)=>{const e=$('t'+i);const x=(t-.45-i*.07)/.45;e.style.opacity=ease(x);e.style.transform=`translateY(${(1-ease(x))*24}px)`});
    if(br.length){$('bl').style.opacity=ease((t-1.3)/.4);br.forEach((b,i)=>{const e=$('b'+i);const x=ease((t-1.4-i*.06)/.35);e.style.opacity=x;e.style.transform=`scale(${.6+.4*x})`});
      if(more>0){const x=ease((t-1.4-br.length*.06)/.35);$('bm').style.opacity=x}}
    const per=(DUR-0.4)/n;
    c.anims.forEach((f,i)=>{
      const st=0.25+i*per, en=st+per;
      const a=clamp((t-st)/.45)*(i==n-1?1:clamp((en+.2-t)/.45));
      const e=$('f'+i);e.style.opacity=ease(a);
      e.style.transform=`scale(${0.94+0.06*ease(clamp((t-st)/.6))+0.02*clamp((t-st)/per)}) translateY(${(1-ease(clamp((t-st)/.6)))*30}px)`;
      $('c'+i).style.opacity=ease(a);
      if(f.type==='gif'&&a>0)play('g'+i,Math.max(0,t-st)*1000);
    });
    fadeAll(t);
  };
}

function buildPanels(half){
  const list=D.panels, show=list.slice(half*7,half*7+7), SLOT=1.55;
  DUR=0.35+show.length*SLOT+0.3;
  let h=`<div class="glow" style="background:radial-gradient(1100px 700px at 70% 50%, rgba(139,92,246,.18), transparent 70%)"></div>`;
  h+=`<div class="abs" id="ph" style="left:80px;top:62px;display:flex;align-items:center;gap:18px"><div class="pill" style="width:64px;height:64px;background:rgba(196,181,253,.18)">${svg('mdiDockLeft',36,'#7c3aed')}</div><div><div style="font-size:44px;font-weight:800;letter-spacing:-.8px">Sidebar panels</div><div style="font-size:21px;color:#566073;margin-top:4px">${list.length} integrations with their own panel</div></div></div>`;
  list.forEach((p,i)=>{
    h+=`<div class="abs pli" id="l${i}" style="left:80px;top:${210+i*58}px;width:540px;height:50px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:14px">
      <div class="pill" style="width:36px;height:36px;flex:none;background:${hex(p.accent,.2)}">${svg(p.icon,21,p.accent)}</div><div style="font-size:21px;font-weight:600;white-space:nowrap">${p.title}</div></div>`;
  });
  const FX=680,FY=70,FW=1160,FH=920,BAR=46;
  h+=`<div class="abs" id="frame" style="left:${FX}px;top:${FY}px;width:${FW}px;height:${FH}px;border-radius:20px;overflow:hidden;background:#ffffff;border:1px solid #e3e7ef;box-shadow:0 30px 90px rgba(30,40,80,.18)">
    <div style="height:${BAR}px;background:#eef1f6;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid #e3e7ef"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><div id="url" style="margin-left:18px;font-size:17px;color:#6b7385"></div></div>`;
  show.forEach((p,i)=>{
    const s=(FW)/p.w; const hh=p.h*s;
    h+=`<div class="abs" id="pp${i}" style="left:0;top:${BAR}px;width:${FW}px;height:${FH-BAR}px;overflow:hidden;opacity:0"><img id="pi${i}" src="${p.file}" style="position:absolute;left:0;top:0;width:${FW}px;height:${hh}px;transform-origin:50% 0"></div>`;
  });
  h+=`</div>`;
  root.innerHTML=h;
  return t=>{
    rise('ph',t,.05);
    const fr=$('frame');fr.style.opacity=ease((t-.15)/.5);fr.style.transform=`translateY(${(1-ease((t-.15)/.6))*30}px)`;
    let cur=-1;
    show.forEach((p,i)=>{
      const st=0.35+i*SLOT,en=st+SLOT;
      const a=clamp((t-st+.15)/.3)*(i==show.length-1?1:clamp((en+.15-t)/.3));
      $('pp'+i).style.opacity=a;
      const hh=p.h*(FW/p.w),vis=FH-BAR;
      $('pi'+i).style.transform=`scale(${1+0.02*clamp((t-st)/SLOT)})`;
      if(t>=st-.15)cur=i;
    });
    list.forEach((p,i)=>{const e=$('l'+i);const j=i-half*7;const x=ease((t-.2-i*.04)/.4);
      const on=j===cur;e.style.opacity=x*(on?1:(j>=0&&j<7?.75:.35));e.style.background=on?hex(p.accent,.22):'transparent';e.style.boxShadow=on?`inset 0 0 0 1px ${hex(p.accent,.6)}`:'none'});
    if(cur>=0)$('url').textContent='Home Assistant  ·  '+show[cur].title+(show[cur].cap&&show[cur].cap!==show[cur].title?'  ·  '+show[cur].cap:'');
    fadeAll(t);
  };
}

function buildMontage(){
  DUR=8;
  const M=D.montage;
  let h=`<div class="glow" style="background:radial-gradient(1100px 600px at 50% 10%, rgba(251,191,36,.14), transparent 70%)"></div>`;
  h+=`<div class="abs" id="mt" style="left:0;right:0;top:50px;text-align:center;font-size:64px;font-weight:800;letter-spacing:-1.3px"><span id="mn" style="color:#d97706">0</span> animations</div>`;
  h+=`<div class="abs" id="ms" style="left:0;right:0;top:136px;text-align:center;font-size:27px;color:#566073">Cards come alive with the real state of your devices, in light and dark themes</div>`;
  const CW=425,CH=262,G=20,X0=(1920-(4*CW+3*G))/2,Y0=200;
  M.forEach((m,i)=>{const c=i%4,r=Math.floor(i/4);
    const s=Math.min((CW-20)/m.w,(CH-50)/m.h);const w=m.w*s,hh=m.h*s;
    h+=`<div class="abs mc" id="m${i}" style="left:${X0+c*(CW+G)}px;top:${Y0+r*(CH+G)}px;width:${CW}px;height:${CH}px;border-radius:20px;background:#ffffff;border:1px solid #e3e7ef">
      <div class="abs" style="left:${(CW-w)/2}px;top:10px;width:${w}px;height:${hh}px">${gifCanvas('mg'+i,m.gif,m.w,m.h,'width:100%;height:100%;display:block')}</div>
      <div class="abs" style="left:0;right:0;bottom:9px;text-align:center;font-size:17px;font-weight:600;color:#566073;white-space:nowrap">${m.title}${m.cap?` <span style="color:#8a92a3">· ${m.cap}</span>`:''}</div></div>`});
  root.innerHTML=h;
  return t=>{
    rise('mt',t,.05);rise('ms',t,.35);$('mn').textContent=Math.round(D.counts.anims*easeIO((t-.1)/1.6));
