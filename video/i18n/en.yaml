focus:
  ha-smart-comfort:
    tag: Alerts that understand the situation, and a home that adjusts itself.
    simple:
    - - mdiMagicStaff
      - One “Discover” button
      - rooms, sensors, ACs and purifiers found and set up in one click
    - - mdiGestureTap
      - Notifications you can act on
      - “Snooze 4 h” or “Got it” right from your phone
    - - mdiTune
      - Everything in one panel
      - each room is set with a few switches
  ha-system-hub:
    tag: Home Assistant's health scored out of 100, and failures fixed before you even see them.
    simple:
    - - mdiToggleSwitchOutline
      - Install it, then forget it
      - each module turns on in one click and watches on its own
    - - mdiUpdate
      - “Update all”
      - HA, add-ons, devices and Marketplace in a single button
    - - mdiBellBadgeOutline
      - A badge that tells you
      - the sidebar shows when something needs a look
  ha-house-rules:
    tag: Your home's reflexes, reliable and thoughtful, without writing a single automation.
    simple:
    - - mdiImport
      - Takes over your automations
      - existing reflexes are imported as rules (never deleted)
    - - mdiPlayCircleOutline
      - A “Test” button
      - on every rule, to see the result right away
    - - mdiHomeOutline
      - Room by room
      - each room shows its rules and what is going on
  ha-energy-hub:
    tag: 'Your solar panels explained: what they produce, what they lose and why.'
    simple:
    - - mdiMagnifyScan
      - Nothing to wire
      - your installation is detected on its own, across 24 solar integrations
    - - mdiViewDashboardOutline
      - No dashboard to build
      - the full panel is ready right after install
    - - mdiPlayBoxOutline
      - A demo mode
      - to try everything before you even have panels
  ha-maintenance:
    tag: 'Household upkeep that tracks itself: filters, brushes, ink and recurring chores.'
    simple:
    - - mdiMagnifyScan
      - Nothing to type in
      - your devices' consumables are found on their own
    - - mdiCheckCircle
      - A “Done” button
      - that also resets the device's own counter
    - - mdiCalendarMonth
      - A calendar of due dates
      - and a single reminder a day, each item once
