focus:
  ha-smart-comfort:
    tag: Des alertes qui comprennent la situation, et une maison qui se règle seule.
    simple:
    - - mdiMagicStaff
      - Un bouton « Découvrir »
      - pièces, capteurs, clim et purificateurs trouvés et réglés en un clic
    - - mdiGestureTap
      - Des notifications qui se manipulent
      - « Reporter 4 h » ou « Compris » directement depuis le téléphone
    - - mdiTune
      - Tout dans un panneau
      - chaque pièce se règle en quelques interrupteurs
  ha-system-hub:
    tag: La santé de Home Assistant notée sur 100, et les pannes réparées avant que vous ne les voyiez.
    simple:
    - - mdiToggleSwitchOutline
      - Installer, puis oublier
      - chaque module s’active d’un clic et surveille tout seul
    - - mdiUpdate
      - « Tout mettre à jour »
      - HA, add-ons, appareils et Marketplace en un seul bouton
    - - mdiBellBadgeOutline
      - Un badge qui prévient
      - la barre latérale dit quand il y a quelque chose à regarder
  ha-house-rules:
    tag: Les réflexes de la maison, fiables et réfléchis, sans écrire une automatisation.
    simple:
    - - mdiImport
      - Reprend vos automatisations
      - les réflexes existants sont importés en règles (jamais supprimés)
    - - mdiPlayCircleOutline
      - Un bouton « Tester »
      - sur chaque règle, pour voir le résultat tout de suite
    - - mdiHomeOutline
      - Pièce par pièce
      - chaque pièce montre ses règles et ce qui s’y passe
  ha-energy-hub:
    tag: 'Vos panneaux solaires expliqués : ce qu’ils produisent, ce qu’ils perdent et pourquoi.'
    simple:
    - - mdiMagnifyScan
      - Rien à câbler
      - l’installation est détectée seule, sur 24 intégrations solaires
    - - mdiViewDashboardOutline
      - Aucun dashboard à construire
      - le panneau complet est prêt dès l’installation
    - - mdiPlayBoxOutline
      - Un mode démo
      - pour tout essayer avant même d’avoir des panneaux
  ha-maintenance:
    tag: 'L’entretien de la maison suivi tout seul : filtres, brosses, encre et tâches récurrentes.'
    simple:
    - - mdiMagnifyScan
      - Rien à saisir
      - les consommables de vos appareils sont trouvés tout seuls
    - - mdiCheckCircle
      - Un bouton « Fait »
      - qui remet aussi le compteur de l’appareil à zéro
    - - mdiCalendarMonth
      - Un agenda des échéances
      - et un seul rappel par jour, chaque élément une fois
