name: Rendering

# The site as Safari draws it: build, check the internal links, then render a few pages in WebKit (light and
# dark, desktop and phone). The captures are attached to the run as the "webkit-captures" artifact.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      # Read-only: the deploy workflow owns the image cache
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/hp-images
          key: hp-images-${{ hashFiles('src/data/projects.yaml', 'src/lib/optimize.ts') }}-
          restore-keys: |
            hp-images-${{ hashFiles('src/data/projects.yaml', 'src/lib/optimize.ts') }}-
            hp-images-
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/check-links.mjs dist
      - run: npx playwright install --with-deps webkit
      - run: node scripts/visual.mjs dist
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-captures
          path: visual/
          if-no-files-found: ignore
          retention-days: 14
