name: Keep scheduled workflows alive

# GitHub turns off the scheduled workflows of a public repository after 60 days without activity: the daily
# rebuild and the release watch would then stop silently. Enabling them again through the API (a no-op while
# they are on) restarts that 60-day count, this workflow included, without any commit.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in deploy.yml watch-releases.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
            echo "$wf enabled"
          done
